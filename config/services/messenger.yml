services:
    # Register message handlers for Symfony Messenger
    PhpList\Core\Domain\Messaging\MessageHandler\:
        autowire: true
        resource: '../../src/Domain/Messaging/MessageHandler'
        tags: [ 'messenger.message_handler' ]

    # Register Subscription message handlers (e.g., DynamicTableMessageHandler)
    PhpList\Core\Domain\Subscription\MessageHandler\:
        autowire: true
        resource: '../../src/Domain/Subscription/MessageHandler'
        tags: [ 'messenger.message_handler' ]

    # Register Search message handlers (e.g., IndexDocumentMessageHandler)
    PhpList\Core\Domain\Search\MessageHandler\:
        autowire: true
        resource: '../../src/Domain/Search/MessageHandler'
        tags: [ 'messenger.message_handler' ]

    PhpList\Core\Domain\Messaging\MessageHandler\CampaignProcessor\CampaignProcessorMessageHandler:
        autowire: true
        autoconfigure: true

    PhpList\Core\Domain\Messaging\MessageHandler\CampaignProcessor\TestCampaignProcessorMessageHandler:
        autowire: true
        autoconfigure: true
