services:
    # Register message handlers for Symfony Messenger
    PhpList\Core\Domain\Messaging\MessageHandler\:
        autowire: true
        resource: '../../src/Domain/Messaging/MessageHandler'
        tags: [ 'messenger.message_handler' ]

    # Register Subscription message handlers (e.g., DynamicTableMessageHandler)
    PhpList\Core\Domain\Subscription\MessageHandler\:
        autowire: true
        resource: '../../src/Domain/Subscription/MessageHandler'
        tags: [ 'messenger.message_handler' ]

    # Register Search message handlers (e.g., IndexDocumentMessageHandler)
    PhpList\Core\Domain\Search\MessageHandler\:
        autowire: true
        resource: '../../src/Domain/Search/MessageHandler'
        tags: [ 'messenger.message_handler' ]

    PhpList\Core\Domain\Messaging\MessageHandler\CampaignProcessorMessageHandler:
        autowire: true
        autoconfigure: true

    PhpList\Core\Domain\Messaging\MessageHandler\CampaignProcessorTestMessageHandler:
        autowire: true
        autoconfigure: true

    PhpList\Core\Domain\Common\Schedule\PhpListSchedule:
        autowire: true
        autoconfigure: true
        arguments:
            $queueInterval: '%app.schedule.queue_interval%'
            $bounceInterval: '%app.schedule.bounce_interval%'
            $tldInterval: '%app.schedule.tld_interval%'
            $cleanupInterval: '%app.schedule.cleanup_interval%'
