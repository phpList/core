# This file is a "template" of what your parameters.yml file should look like
# Set parameters here that may be different on each deployment target of the app, e.g. development, staging, production.
# https://symfony.com/doc/current/best_practices/configuration.html#infrastructure-related-configuration
#
# These variables are read from environment variables using the "env" construct.
# The environment variables themselves are defined in the ".env" file (see ".env.dist" for the template)
# and/or in the actual environment (e.g. Apache host configuration, command line).
parameters:
    # Database
    database.driver: '%env(PHPLIST_DATABASE_DRIVER)%'
    database.path: '%env(PHPLIST_DATABASE_PATH)%'
    database.host: '%env(PHPLIST_DATABASE_HOST)%'
    database.port: '%env(PHPLIST_DATABASE_PORT)%'
    database.name: '%env(PHPLIST_DATABASE_NAME)%'
    database.user: '%env(PHPLIST_DATABASE_USER)%'
    database.password: '%env(PHPLIST_DATABASE_PASSWORD)%'
    database.prefix: '%env(DATABASE_PREFIX)%'
    database.list_table_prefix: '%env(LIST_TABLE_PREFIX)%'

    # Application
    app.dev_version: '%env(APP_DEV_VERSION)%'
    app.dev_email: '%env(APP_DEV_EMAIL)%'
    app.powered_by_phplist: '%env(APP_POWERED_BY_PHPLIST)%'
    app.preference_page_show_private_lists: '%env(PREFERENCEPAGE_SHOW_PRIVATE_LISTS)%'
    app.rest_api_base_url: '%env(API_BASE_URL)%api/v2'
    app.api_base_url: '%env(API_BASE_URL)%'
    app.frontend_base_url: '%env(FRONT_END_BASE_URL)%'
    # falls back to empty so existing .env files without APP_WEBSITE keep working (the value may live in the database)
    env(APP_WEBSITE): ''
    app.website: '%env(APP_WEBSITE)%'
    app.parallel_use_with_phplist3: '%env(PARALLEL_USE_WITH_PHPLIST3)%'
    app.confirmation_url: '%env(CONFIRMATION_URL)%'
    app.subscription_confirmation_url: '%env(SUBSCRIPTION_CONFIRMATION_URL)%'
    app.password_reset_url: '%env(PASSWORD_RESET_URL)%'
    app.show_unsubscribe_link: '%env(SHOW_UNSUBSCRIBELINK)%'
    app.verify_ssl: '%env(VERIFY_SSL)%'
    app.public_schema: '%env(PUBLIC_SCHEMA)%'
    # A secret key that's used to generate certain security-related tokens
    app.secret: '%env(PHPLIST_SECRET)%'

    # Mailer
    mailer.from: '%env(MAILER_FROM)%'
    mailer.dsn: '%env(MAILER_DSN)%'

    # Bounce mailbox settings
    bounce.email: '%env(BOUNCE_EMAIL)%'
    bounce.imap.password: '%env(BOUNCE_IMAP_PASS)%'
    bounce.imap.host: '%env(BOUNCE_IMAP_HOST)%'
    bounce.imap.port: '%env(BOUNCE_IMAP_PORT)%'
    bounce.imap.encryption: '%env(BOUNCE_IMAP_ENCRYPTION)%'
    bounce.imap.mailbox: '%env(BOUNCE_IMAP_MAILBOX)%'
    bounce.imap.mailbox_name: '%env(BOUNCE_IMAP_MAILBOX_NAME)%'
    bounce.imap.protocol: '%env(BOUNCE_IMAP_PROTOCOL)%'
    bounce.unsubscribe_threshold: '%env(BOUNCE_IMAP_UNSUBSCRIBE_THRESHOLD)%'
    bounce.blacklist_threshold: '%env(BOUNCE_IMAP_BLACKLIST_THRESHOLD)%'
    bounce.purge: '%env(BOUNCE_IMAP_PURGE)%'
    bounce.purge_unprocessed: '%env(BOUNCE_IMAP_PURGE_UNPROCESSED)%'

    # Messenger (asynchronous processing)
    messenger.transport_dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
    messenger.search_transport_dsn: '%env(SEARCH_TRANSPORT_DSN)%'

    # Scheduler intervals (relative strings, empty disables), see docs/Scheduling.md
    # The env() lines are the defaults for installs whose .env predates these variables.
    env(PHPLIST_SCHEDULE_QUEUE): '1 minute'
    env(PHPLIST_SCHEDULE_BOUNCES): '1 day'
    env(PHPLIST_SCHEDULE_TLDS): '1 month'
    env(PHPLIST_SCHEDULE_CLEANUP): '1 day'
    app.schedule.queue_interval: '%env(PHPLIST_SCHEDULE_QUEUE)%'
    app.schedule.bounce_interval: '%env(PHPLIST_SCHEDULE_BOUNCES)%'
    app.schedule.tld_interval: '%env(PHPLIST_SCHEDULE_TLDS)%'
    app.schedule.cleanup_interval: '%env(PHPLIST_SCHEDULE_CLEANUP)%'

    # Elasticsearch
    elasticsearch.enabled: '%env(bool:ELASTICSEARCH_ENABLED)%'
    elasticsearch.hosts: '%env(csv:ELASTICSEARCH_HOSTS)%'
    elasticsearch.username: '%env(ELASTICSEARCH_USERNAME)%'
    elasticsearch.password: '%env(ELASTICSEARCH_PASSWORD)%'
    elasticsearch.index_prefix: '%env(DATABASE_PREFIX)%'
    elasticsearch.connect_timeout: '%env(int:ELASTICSEARCH_CONNECT_TIMEOUT)%'
    elasticsearch.request_timeout: '%env(int:ELASTICSEARCH_REQUEST_TIMEOUT)%'
    elasticsearch.purge.subscriber_history_retention: '%env(ELASTICSEARCH_PURGE_SUBSCRIBER_HISTORY_RETENTION)%'

    # Graylog
    graylog.host: 'graylog.phplist.local'
    graylog.port: 12201

    # Uploads
    uploads.images_dir: '%env(UPLOADIMAGES_DIR)%'
    uploads.allowed_mime_types: ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/svg+xml']
    uploads.allowed_extensions: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg']
    uploads.max_size: '%env(PHPLIST_UPLOADS_MAX_SIZE)%'
    uploads.max_avatar_size: '%env(MAX_AVATAR_SIZE)%'

    # Message sending
    messaging.isp_conf_path: '%env(APP_PHPLIST_ISP_CONF_PATH)%'
    messaging.mail_queue_batch_size: '%env(MAILQUEUE_BATCH_SIZE)%'
    messaging.mail_queue_period: '%env(MAILQUEUE_BATCH_PERIOD)%'
    messaging.mail_queue_throttle: '%env(MAILQUEUE_THROTTLE)%'
    messaging.max_process_time: '%env(MESSAGING_MAX_PROCESS_TIME)%'
    messaging.stuck_campaign_threshold: '%env(int:MESSAGING_STUCK_CAMPAIGN_THRESHOLD)%'
    messaging.max_mail_size: '%env(MAX_MAILSIZE)%'
    messaging.default_message_age: '%env(DEFAULT_MESSAGEAGE)%'
    messaging.use_manual_text_part: '%env(USE_MANUAL_TEXT_PART)%'
    messaging.use_list_exclude: '%env(bool:USE_LIST_EXCLUDE)%'
    messaging.use_domain_throttle: '%env(bool:USE_DOMAIN_THROTTLE)%'
    messaging.domain_batch_size: '%env(int:DOMAIN_BATCH_SIZE)%'
    messaging.domain_batch_period: '%env(int:DOMAIN_BATCH_PERIOD)%'
    messaging.domain_auto_throttle: '%env(bool:DOMAIN_AUTO_THROTTLE)%'
    messaging.blacklist_grace_time: '%env(MESSAGING_BLACKLIST_GRACE_TIME)%'
    messaging.google_sender_id: '%env(GOOGLE_SENDERID)%'
    messaging.use_amazon_ses: '%env(USE_AMAZONSES)%'
    messaging.use_precedence_header: '%env(USE_PRECEDENCE_HEADER)%'
    messaging.embed_external_images: '%env(EMBEDEXTERNALIMAGES)%'
    messaging.embed_uploaded_images: '%env(EMBEDUPLOADIMAGES)%'
    messaging.external_image_max_age: '%env(EXTERNALIMAGE_MAXAGE)%'
    messaging.external_image_timeout: '%env(EXTERNALIMAGE_TIMEOUT)%'
    messaging.external_image_max_size: '%env(EXTERNALIMAGE_MAXSIZE)%'
    messaging.email_text_credits: '%env(EMAILTEXTCREDITS)%'
    messaging.always_add_user_track: '%env(ALWAYS_ADD_USERTRACK)%'
    messaging.send_list_admin_copy: '%env(SEND_LISTADMIN_COPY)%'

    # Forwarding and attachments
    messaging.forward.alternative_content: '%env(FORWARD_ALTERNATIVE_CONTENT)%'
    messaging.forward.email_period: '%env(FORWARD_EMAIL_PERIOD)%'
    messaging.forward.email_count: '%env(FORWARD_EMAIL_COUNT)%'
    messaging.forward.personal_note_size: '%env(FORWARD_PERSONAL_NOTE_SIZE)%'
    messaging.forward.friend_count_attribute: '%env(FORWARD_FRIEND_COUNT_ATTRIBUTE)%'
    messaging.forward.keep_attributes: '%env(KEEPFORWARDERATTRIBUTES)%'
    messaging.attachment.download_url: '%env(PHPLIST_ATTACHMENT_DOWNLOAD_URL)%'
    messaging.attachment.repository_path: '%env(PHPLIST_ATTACHMENT_REPOSITORY_PATH)%'
