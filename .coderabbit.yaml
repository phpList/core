# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "chill"
reviews:
  profile: "chill"
  high_level_summary: true
  collapse_walkthrough: true
  suggested_labels: false
  high_level_summary_in_walkthrough: false
  poem: false
  finishing_touches:
    docstrings:
      enabled: false
  path_instructions:
    - path: "src/Domain/**"
      instructions: |
        You are reviewing PHP domain-layer code. Enforce domain purity, with a relaxed policy for DynamicListAttr:

        - ❌ Do not allow, flag ANY DB write / finalization:
          - `$entityManager->flush(...)`, `$this->entityManager->flush(...)`
          - `$em->beginTransaction()`, `$em->commit()`, `$em->rollback()`, `$em->transactional(...)`
          - `$em->getConnection()->executeStatement(...)` for DML/DDL (INSERT/UPDATE/DELETE/ALTER/...)
        - ✅ Accessing Doctrine *metadata*, *schema manager*, or *read-only schema info* is acceptable
          as long as it does not modify state or perform writes. Accessing Doctrine *persistence APIs* 
          persist, remove, etc.) is acceptable, allow scheduling changes in the UnitOfWork (no DB writes)

        - ✅ **Relaxed rule for DynamicListAttr-related code**:
          - DynamicListAttr is a special case dealing with dynamic tables/attrs.
          - It is acceptable for DynamicListAttr repositories/services to:
            - Create/update/drop DynamicListAttr tables/columns.
            - Use Doctrine persistence APIs (`persist`, `remove`, `flush`, etc.)
              as part of managing DynamicListAttr data and schema.
          - Do *not* flag persistence or schema-creation calls that are clearly scoped
            to DynamicListAttr tables or their management.
          - Still prefer keeping this logic well-encapsulated (e.g. in dedicated services/repos),
            not scattered across unrelated domain objects.

        - ✅ **Relaxed rule for atomic conditional-UPDATE reservation/claim patterns**:
          - Some Domain repositories intentionally use `$connection->executeStatement(...)` to run a
            conditional `UPDATE ... WHERE <guard>` (checking the affected-row count) or a guarded
            `INSERT` (catching `UniqueConstraintViolationException`) as a portable, lock-free way to
            atomically claim/reserve a row across concurrent workers - e.g.
            `MessageRepository::tryClaimForProcessing` and
            `DomainThrottleStateRepository::tryReserveSlot`/`resetBlockedCount`.
          - This is not a domain-purity violation: it involves no `flush()`, transaction, or DDL, and
            avoids vendor-specific upsert/locking syntax so it stays portable across MySQL/PostgreSQL/SQLite.
          - Do *not* flag `executeStatement()` DML calls that follow this guarded-UPDATE/affected-rows
            or catch-`UniqueConstraintViolationException`-on-INSERT pattern against the repository's own
            entity table.
          - Still flag any DBAL write that is unconditional, unrelated to claim/reservation semantics, or
            that mutates a different entity's table than the repository owns.

        - ⚠️ For other non-DynamicListAttr code:
          - If code is invoking actual table-creation, DDL execution, or schema synchronization,
            then request moving that to the Infrastructure or Application layer (e.g. MessageHandler).
          - Repositories in Domain should be abstractions without side effects; they should express *intent*,
            not perform flush/transactional logic.

    - path: "src/**/Command/**"
      instructions: |
        Application layer (Commands/Handlers) is the right place to coordinate persistence.

        - ✅ It is acceptable to call $entityManager->flush() here.
        - Check that flush is used atomically (once per unit of work) after all domain operations.
        - Ensure no domain entity or domain service is calling flush; only the handler orchestrates it,
          except for the explicitly allowed DynamicListAttr management logic in Domain.
        - Prefer $em->transactional(...) or explicit try/catch with rollback on failure when multiple writes are involved.

    - path: "src/**/MessageHandler/**"
      instructions: |
        Background jobs/workers may perform persistence and schema management.

        - ✅ Allow `$entityManager->flush()` when the job is the orchestration boundary.
        - ✅ Allow table creation, migration, or schema synchronization (e.g. via Doctrine SchemaTool or SchemaManager),
          as this is considered infrastructure-level orchestration.
        - For DynamicListAttr-related jobs, it is fine to orchestrate both data and schema changes here,
          as long as responsibilities remain clear and behavior is predictable.
        - Verify idempotency for schema operations where practical — e.g., check if a table exists before creating.
        - Ensure domain-layer code invoked by the job (outside the DynamicListAttr exception) remains free of persistence calls.
        - Batch flush operations where practical.

    - path: "src/Domain/Search/**"
      instructions: &elasticsearch_consistency |
        You are reviewing code for the MySQL/Elasticsearch dual-write system (write-through DB +
        Elasticsearch via `SearchIndexDoctrineListener`, with `*ConfigurableReader`/`*HybridReader`
        classes able to read from either backend, and a retention/purge command that deletes DB rows
        once confirmed in Elasticsearch). Flag anything that can let the two stores drift apart:

        - ❌ Bulk/raw deletes or updates on a `SearchIndexableInterface` entity's table that bypass
          Doctrine's entity lifecycle - DQL `->delete()`/`->update()` queries, or DBAL
          `executeStatement()`/raw SQL - never trigger `SearchIndexDoctrineListener::preRemove/postRemove`
          (those only fire for `EntityManager::remove()`/`persist()` + `flush()`). Any such bulk
          operation silently skips the Elasticsearch side. This is legitimate ONLY when it is an
          explicit, reviewed "delete from MySQL but deliberately keep the Elasticsearch document"
          retention/purge path (and even then, it must verify the row exists in Elasticsearch via a
          real ES query *before* deleting - never delete on the assumption that dual-write "should
          have" succeeded).
        - ❌ A `SearchIndexableInterface` entity with a foreign key that has a DB-level
          `onDelete: 'CASCADE'` (`#[ORM\JoinColumn(..., onDelete: 'CASCADE')]`) but no matching
          Doctrine-level `cascade: ['remove']` on the owning/parent side's association. Without the
          Doctrine-level cascade, deleting the parent lets the database silently drop child rows that
          Doctrine never loads/removes individually, so the listener never fires for them and their
          Elasticsearch documents are orphaned.
        - ❌ Calls to `ElasticsearchClientInterface::index()`/`delete()`, or construction of
          `IndexDocumentMessage`, using a hardcoded, reused, or non-monotonic revision instead of the
          established wall-clock-microseconds pattern (see `SearchIndexDoctrineListener::nextRevision()`).
          External versioning is what stops a delayed/retried write or delete from clobbering newer
          state - a wrong revision can let a stale message win.
        - ❌ New/changed `*ConfigurableReader` implementations that don't correctly gate on
          `elasticsearch.enabled` and fall back to the Doctrine repository, or that silently mix data
          from both backends for the same logical query/response without that being the explicit intent.
        - ⚠️ Any consumer that needs a *complete*/unbounded history or aggregate (not a bounded recent
          window) reading directly from the Doctrine repository for an entity that has a retention/purge
          policy configured elsewhere - it will silently see only the retained window once older rows
          are purged. Point out that it should read through the ES-backed reader/interface instead.
        - ⚠️ Missing or incomplete tests around the above: a repository method that deletes/updates rows
          for a `SearchIndexableInterface` entity should have a test proving it does (or intentionally
          does not) go through the dual-write path, and any new cascade relationship should have a test
          that actually removes the parent and asserts the child is gone too.

    - path: "src/**/*Elasticsearch*.php"
      instructions: *elasticsearch_consistency

    - path: "src/**/Service/Search/**"
      instructions: *elasticsearch_consistency

    - path: "src/Core/Doctrine/SearchIndexDoctrineListener.php"
      instructions: *elasticsearch_consistency

  auto_review:
    enabled: true
    base_branches:
      - ".*"
    drafts: false
#    ignore_title_keywords:
#      - ''

